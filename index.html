<!doctype html>

<title>Vyšší, nebo nižší</title>
<meta name="description" content="Rychlá vědomostní hra: tipni si, jestli je druhá hodnota vyšší, nebo nižší. Města ČR, historie a ceny potravin.">

<meta property="og:title" content="Vyšší, nebo nižší">

<style>
/* Layout: duel dvou karet (na mobilu pod sebou), uprostřed kotouč VS, nahoře lišta se skóre.
   Barvy: modrá = známá hodnota, zelená = nižší/dřív/levnější, oranžová = vyšší/později/dražší. */
:root{
  --bg:#FFFFFF;
  --surface:#FFFFFF;
  --soft:#DCE8F8;
  --primary:#4776C5;
  --on-primary:#FFFFFF;
  --lo:#27866F;
  --hi:#C47A35;
  --ink:#1D2733;
  --muted:#5B6675;
  --line:#DCE8F8;
  --shadow:0 1px 2px rgba(29,39,51,.06), 0 6px 20px rgba(71,118,197,.08);
  --f-display:Georgia, "Gelasio", "Times New Roman", serif;
  --f-body:Georgia, "Gelasio", "Times New Roman", serif;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:16px;overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
.app{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-height:100%}

/* ---------- MENU ---------- */
.brand{display:flex;flex-direction:column;gap:8px;padding-top:8px}
.brand h1{font-family:var(--f-display);font-weight:900;font-size:clamp(34px,8vw,64px);line-height:.95;margin:0;letter-spacing:-.02em;text-wrap:balance}
.brand h1 .w-hi{color:var(--hi)}
.brand h1 .w-lo{color:var(--lo)}
.brand h1 .arrows{color:var(--primary)}
.brand p{margin:0;color:var(--muted);max-width:52ch;line-height:1.5}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.cat{
  text-align:left;background:var(--surface);border-radius:18px;padding:18px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:10px;border:2px solid var(--line);
  transition:transform .15s ease,border-color .15s ease;
}
.cat:hover{transform:translateY(-3px);border-color:var(--primary)}
.cat .tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--primary);font-weight:700}
.cat h2{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0;line-height:1.15}
.cat .desc{color:var(--muted);font-size:14px;line-height:1.45;margin:0}
.cat .meta{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.cat .meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.cat .play{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--on-primary);background:var(--primary);border-radius:12px;padding:10px 18px;white-space:nowrap;box-shadow:0 2px 6px rgba(71,118,197,.3);transition:filter .15s, transform .15s}
.cat:hover .play{filter:brightness(1.08);transform:translateY(-1px)}
.cat:active .play{transform:scale(.96)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;color:var(--muted);font-size:14px;line-height:1.5}
.how div{padding:12px 0;border-top:2px solid var(--line)}
.how strong{color:var(--ink);display:block;margin-bottom:2px}
.foot{color:var(--muted);font-size:12px;line-height:1.5;margin-top:auto}

/* ---------- HRA ---------- */
.hud{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hud .left{display:flex;align-items:center;gap:10px;min-width:0}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;flex:none}
.hud .catname{font-family:var(--f-display);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;gap:16px;align-items:flex-end}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.stat span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.stat b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.combo{font-family:var(--f-display);font-weight:900;color:var(--on-primary);background:var(--primary);border-radius:999px;padding:4px 10px;font-size:14px;align-self:center;transition:transform .2s}
.combo.pop{transform:scale(1.35) rotate(-6deg)}

.arena{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;min-height:0}
@media (max-width:640px){.arena{grid-template-columns:1fr}}
.card{
  position:relative;background:var(--surface);border-radius:22px;padding:22px 20px;box-shadow:var(--shadow);
  border:2px solid var(--line);
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px;
  min-height:220px;overflow:hidden;min-width:0;transition:border-color .2s, background .2s;
}
@media (max-width:640px){.card{min-height:180px;padding:18px 16px}}
.card.left{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.card.left .label,.card.left .sub,.card.left .value small{color:var(--on-primary);opacity:.85}
.card.left .value{color:var(--on-primary)}
.card .label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card .name{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,4.4vw,34px);line-height:1.1;text-wrap:balance;overflow-wrap:anywhere}
.card .sub{color:var(--muted);font-size:14px}
.card .value{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,6vw,44px);color:var(--primary);font-variant-numeric:tabular-nums;line-height:1.05}
.card .value small{font-size:.45em;font-weight:500;color:var(--muted);display:block;margin-top:4px;font-family:var(--f-body);letter-spacing:.02em}
.card .question{color:var(--ink);font-size:15px;margin-top:4px}
.timer{position:absolute;left:0;top:0;height:6px;background:var(--primary);width:100%;transform-origin:left center}
.timer.low{background:var(--hi)}
.vs{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:58px;height:58px;border-radius:50%;background:var(--surface);color:var(--primary);border:3px solid var(--primary);
  display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:16px;
  box-shadow:0 0 0 6px var(--bg);z-index:2;transition:background .2s,color .2s;
}
.vs.good{background:var(--primary);color:var(--on-primary)}
.vs.bad{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:10px}
.choice{
  border-radius:14px;padding:14px 10px;font-family:var(--f-display);font-weight:700;font-size:16px;color:#fff;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s ease, filter .15s;
}
.choice.hi{background:var(--hi)}
.choice.lo{background:var(--lo)}
.choice:hover{filter:brightness(1.08)}
.choice:active{transform:scale(.96)}
.choice:disabled{opacity:.4;cursor:default;filter:none}
/* Odkrytí: barva podle směru (zelená = nižší/dřív, oranžová = vyšší/později) */
.card.right.dir-hi{border-color:var(--hi)}
.card.right.dir-hi .value{color:var(--hi)}
.card.right.dir-lo{border-color:var(--lo)}
.card.right.dir-lo .value{color:var(--lo)}
.card.enter{animation:enter .35s ease both}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.floater{position:absolute;right:18px;top:16px;font-family:var(--f-display);font-weight:900;color:var(--primary);font-size:20px;animation:float .8s ease forwards;pointer-events:none}
@keyframes float{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-30px)}}
.hint{color:var(--muted);font-size:12px;text-align:center}

/* ---------- KONEC ---------- */
.over{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:24px 0}
.over .kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--hi);font-weight:700}
.over h2{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,6vw,44px);margin:0;line-height:1.05;text-wrap:balance}
.over .why{color:var(--muted);max-width:46ch;line-height:1.5;margin:0}
.over .why b{color:var(--ink)}
.bigscore{display:flex;gap:28px;justify-content:center;margin:6px 0}
.bigscore div{display:flex;flex-direction:column;gap:4px}
.bigscore span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bigscore b{font-family:var(--f-display);font-weight:900;font-size:42px;font-variant-numeric:tabular-nums;color:var(--primary)}
.newbest{background:var(--lo);color:#fff;font-weight:700;border-radius:999px;padding:4px 12px;font-size:13px}
.actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:360px}
.btn{border-radius:14px;padding:14px 16px;font-family:var(--f-display);font-weight:700;font-size:15px;background:var(--surface);border:2px solid var(--line)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.ad{background:var(--soft);border:2px dashed var(--primary);color:var(--primary)}
.btn:disabled{opacity:.5;cursor:default}
.adnote{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;font-size:14px;z-index:20}

/* ---------- reklama (simulace) ---------- */
.adlayer{position:fixed;inset:0;background:rgba(18,24,33,.85);display:grid;place-items:center;z-index:30;padding:24px}
.adbox{background:var(--surface);border-radius:20px;padding:28px;max-width:340px;text-align:center;display:flex;flex-direction:column;gap:10px}
.adbox b{font-family:var(--f-display);font-size:48px;color:var(--primary)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

/* ======================= STAV ======================= */
const store = {
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let best = store.get("vn-best") || {};
let muted = !!store.get("vn-muted");
let S = null; // stav hry
const app = document.getElementById("app");

/* ======================= ZVUK ======================= */
let ac = null;
function beep(freq, dur=0.12, type="square", vol=0.06){
  if(muted) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+dur);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+dur);
  }catch(e){}
}
const sGood = (c)=>{beep(520+c*40,.08);setTimeout(()=>beep(780+c*40,.1),70)};
const sBad = ()=>{beep(180,.25,"sawtooth",.07)};

/* ======================= POMOCNÉ ======================= */
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(msg){
  const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>t.remove(),2200);
}
function pickNext(exclude){
  const items = CATS[S.cat].items;
  const pool = items.map((_,i)=>i).filter(i=>!exclude.includes(i) && !S.recent.includes(i) && items[i][2]!==items[exclude[0]]?.[2]);
  const list = pool.length ? pool : items.map((_,i)=>i).filter(i=>!exclude.includes(i));
  return list[Math.floor(Math.random()*list.length)];
}
const timeLimit = () => Math.max(4, 10 - S.count*0.25);
const multiplier = () => Math.min(4, 1 + Math.floor(S.streak/5));

/* ======================= OBRAZOVKY ======================= */
function renderMenu(){
  stopTimer();
  S = null;
  app.innerHTML = `
    <header class="brand">
      <h1><span class="w-hi">Vyšší</span>, <span class="arrows">nebo</span> <span class="w-lo">nižší</span></h1>
      <p>Dvě věci, jedno rozhodnutí. Tipni si, jestli je ta druhá vyšší, nebo nižší, a stihni to dřív, než doběhne čas.</p>
    </header>
    <section class="cats">
      ${Object.entries(CATS).map(([k,c])=>`
        <button class="cat" data-cat="${k}" id="cat-${k}">
          <span class="tag">${c.tag}</span>
          <h2>${c.name}</h2>
          <p class="desc">${c.desc}</p>
          <span class="meta"><span>Rekord <b>${best[k]||0}</b> · ${c.items.length} položek</span><span class="play">Hrát</span></span>
        </button>`).join("")}
    </section>
    <section class="how">
      <div><strong>Čas běží</strong>Na každý tip máš 10 sekund. Čím déle hraješ, tím méně času.</div>
      <div><strong>Série násobí body</strong>Každých 5 správných v řadě zvedne násobič, až na ×4.</div>
      <div><strong>Jedna chyba a konec</strong>Pak to zkus znovu a překonej svůj rekord.</div>
    </section>
    <p class="foot">Verze 0.1.0 · Prototyp. Data jsou přibližná a před spuštěním je potřeba je ověřit. Reklama je jen simulace.</p>`;
  app.querySelectorAll(".cat").forEach(b=>b.onclick=()=>startGame(b.dataset.cat));
}

function startGame(cat){
  S = {cat, score:0, count:0, streak:0, recent:[], continued:false, locked:false};
  S.left = Math.floor(Math.random()*CATS[cat].items.length);
  S.right = pickNext([S.left]);
  renderGame(true);
}

function renderGame(animate){
  const c = CATS[S.cat];
  const L = c.items[S.left], R = c.items[S.right];
  const m = multiplier();
  app.innerHTML = `
    <div class="hud">
      <div class="left">
        <button class="iconbtn" id="back" aria-label="Zpět do menu">←</button>
        <button class="iconbtn" id="mute" aria-label="${muted?"Zapnout zvuk":"Vypnout zvuk"}">${muted?"🔇":"🔊"}</button>
        <span class="catname">${c.name}</span>
      </div>
      <div class="stats">
        ${m>1?`<span class="combo" id="combo">×${m}</span>`:""}
        <div class="stat"><span>Série</span><b>${S.streak}</b></div>
        <div class="stat"><span>Body</span><b id="score">${S.score}</b></div>
        <div class="stat"><span>Rekord</span><b>${best[S.cat]||0}</b></div>
      </div>
    </div>
    <div class="arena" id="arena">
      <div class="card left ${animate?"":"enter"}">
        <span class="label">Známá hodnota</span>
        <div class="name">${esc(L[0])}</div>
        ${L[1]?`<div class="sub">${esc(L[1])}</div>`:""}
        <div class="value">${c.fmt(L[2])}</div>
      </div>
      <div class="vs" id="vs">VS</div>
      <div class="card right enter" id="rightCard">
        <div class="timer" id="timer"></div>
        <span class="label">Hádej</span>
        <div class="name">${esc(R[0])}</div>
        ${R[1]?`<div class="sub">${esc(R[1])}</div>`:""}
        <div class="value" id="rval">?</div>
        <div class="question">${c.question}</div>
        <div class="choices">
          <button class="choice hi" id="hi">▲ ${c.hi}</button>
          <button class="choice lo" id="lo">▼ ${c.lo}</button>
        </div>
      </div>
    </div>
    <p class="hint">Na klávesnici: šipka nahoru / dolů</p>`;
  document.getElementById("back").onclick = renderMenu;
  document.getElementById("mute").onclick = ()=>{muted=!muted;store.set("vn-muted",muted);renderGameKeepTimer();};
  document.getElementById("hi").onclick = ()=>guess(true);
  document.getElementById("lo").onclick = ()=>guess(false);
  S.locked = false;
  startTimer();
}
function renderGameKeepTimer(){
  const remaining = S.deadline - performance.now();
  renderGame(true);
  S.deadline = performance.now() + remaining;
}

/* ======================= ČASOVAČ ======================= */
let raf = null;
function startTimer(){
  stopTimer();
  S.limit = timeLimit()*1000;
  S.deadline = performance.now() + S.limit;
  const tick = ()=>{
    const el = document.getElementById("timer");
    if(!el || !S) return;
    const left = Math.max(0, S.deadline - performance.now());
    el.style.transform = `scaleX(${left/S.limit})`;
    el.classList.toggle("low", left < 2500);
    if(left<=0){ guess(null); return; }
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}
function stopTimer(){ if(raf) cancelAnimationFrame(raf); raf=null; }

/* ======================= TAH ======================= */
function guess(higher){
  if(!S || S.locked) return;
  S.locked = true;
  stopTimer();
  const c = CATS[S.cat];
  const lv = c.items[S.left][2], rv = c.items[S.right][2];
  const timeLeft = Math.max(0,(S.deadline - performance.now())/1000);
  const correct = higher!==null && (rv===lv || (higher ? rv>lv : rv<lv));
  document.getElementById("hi").disabled = true;
  document.getElementById("lo").disabled = true;
  revealValue(rv, c);
  if(rv!==lv) document.getElementById("rightCard").classList.add(rv>lv?"dir-hi":"dir-lo");
  const card = document.getElementById("rightCard");
  const vs = document.getElementById("vs");

  if(correct){
    S.streak++; S.count++;
    const pts = 10*multiplier() + Math.round(timeLeft);
    S.score += pts;
    vs.classList.add("good"); vs.textContent="✓";
    const f=document.createElement("div");f.className="floater";f.textContent="+"+pts;card.appendChild(f);
    document.getElementById("score").textContent = S.score;
    sGood(Math.min(S.streak,10));
    const prevMult = multiplier();
    setTimeout(()=>{
      S.recent = [S.left, ...S.recent].slice(0,10);
      S.left = S.right;
      S.right = pickNext([S.left]);
      renderGame(false);
      if(S.streak>0 && S.streak%5===0 && S.streak/5<4){ const cb=document.getElementById("combo"); if(cb){cb.classList.add("pop");setTimeout(()=>cb.classList.remove("pop"),250);} }
    }, 950);
  } else {
    vs.classList.add("bad"); vs.textContent="✕";
    document.getElementById("arena").classList.add("shake");
    sBad();
    S.reason = higher===null ? "timeout" : "wrong";
    setTimeout(renderOver, 1200);
  }
}
function revealValue(v, c){
  const el = document.getElementById("rval");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce || S.cat==="historie"){ el.innerHTML = c.fmt(v); return; }
  const t0 = performance.now(), dur = 550;
  const step = now=>{
    const p = Math.min(1,(now-t0)/dur), e = 1-Math.pow(1-p,3);
    const val = Math.round(v*e);
    el.innerHTML = c.fmt(p<1 ? (S.cat==="mesta" ? Math.round(val/100)*100 : val) : v);
    if(p<1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ======================= KONEC HRY ======================= */
function renderOver(){
  const c = CATS[S.cat];
  const L = c.items[S.left], R = c.items[S.right];
  const isBest = S.score > (best[S.cat]||0);
  if(isBest){ best[S.cat] = S.score; store.set("vn-best", best); }
  const strip = (h)=>h.replace(/<small>.*<\/small>/,"").trim();
  const why = S.reason==="timeout"
    ? `Došel čas. <b>${esc(R[0])}</b>: ${strip(c.fmt(R[2]))}, <b>${esc(L[0])}</b>: ${strip(c.fmt(L[2]))}.`
    : `<b>${esc(R[0])}</b>: ${strip(c.fmt(R[2]))}, <b>${esc(L[0])}</b>: ${strip(c.fmt(L[2]))}.`;
  app.innerHTML = `
    <div class="over">
      <span class="kicker">${S.reason==="timeout"?"Došel čas":"Vedle"}</span>
      <h2>${S.count>=10?"Pěkná série!":S.count>=4?"Dobrý pokus":"To se stává"}</h2>
      <p class="why">${why}</p>
      <div class="bigscore">
        <div><span>Body</span><b>${S.score}</b></div>
        <div><span>Správně</span><b>${S.count}</b></div>
      </div>
      ${isBest && S.score>0 ? `<span class="newbest">Nový rekord</span>` : `<span class="adnote">Rekord: ${best[S.cat]||0}</span>`}
      <div class="actions">
        ${!S.continued && S.count>0 ? `<button class="btn ad" id="cont">▶ Pokračovat po reklamě</button>` : ""}
        <button class="btn primary" id="again">Hrát znovu</button>
        <button class="btn" id="share">Zkopírovat výsledek</button>
        <button class="btn" id="menu">Vybrat jiný okruh</button>
      </div>
      ${!S.continued && S.count>0 ? `<span class="adnote">Pokračování je ukázka monetizace: jednou za hru, po krátké reklamě.</span>`:""}
    </div>`;
  document.getElementById("again").onclick = ()=>startGame(S.cat);
  document.getElementById("menu").onclick = renderMenu;
  document.getElementById("share").onclick = share;
  const cont = document.getElementById("cont");
  if(cont) cont.onclick = playAd;
}
function share(){
  const c = CATS[S.cat];
  const blocks = "🟩".repeat(Math.min(S.count,15)) + "🟥";
  const text = `Vyšší, nebo nižší · ${c.name}\n${S.score} bodů, ${S.count} správně v řadě\n${blocks}`;
  const fallback = ()=>{toast("Kopírování se nepovedlo, výsledek: "+S.score+" bodů")};
  try{
    navigator.clipboard.writeText(text).then(()=>toast("Výsledek zkopírován, můžeš ho poslat dál")).catch(fallback);
  }catch(e){fallback()}
}
function playAd(){
  const layer = document.createElement("div");
  layer.className="adlayer";
  layer.innerHTML = `<div class="adbox"><span class="adnote">SIMULACE REKLAMY</span><b id="adn">3</b><span>Tady by běžela krátká reklama. Pak pokračuješ se stejným skóre.</span></div>`;
  document.body.appendChild(layer);
  let n=3;
  const iv = setInterval(()=>{
    n--; const el=document.getElementById("adn"); if(el) el.textContent=n;
    if(n<=0){
      clearInterval(iv); layer.remove();
      S.continued = true;
      S.recent = [S.left, S.right, ...S.recent].slice(0,10);
      S.left = S.right;
      S.right = pickNext([S.left]);
      renderGame(false);
    }
  },1000);
}

/* ======================= KLÁVESNICE ======================= */
document.addEventListener("keydown", e=>{
  if(!S || S.locked || !document.getElementById("hi")) return;
  if(e.key==="ArrowUp"){e.preventDefault();guess(true)}
  if(e.key==="ArrowDown"){e.preventDefault();guess(false)}
});

renderMenu();
</script>
</body>
</html>
